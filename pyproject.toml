[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unit-converter"
version = "0.1.0"
description = "A unit conversion CLI tool for length, weight, temperature, and volume"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["unit", "converter", "cli", "length", "weight", "temperature", "volume"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
uconv = "unit_converter.cli:main"
unit-converter = "unit_converter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/unit-converter"
Repository = "https://github.com/Master-626/unit-converter"
Issue-Tracker = "https://github.com/Master-626/unit-converter/issues"
